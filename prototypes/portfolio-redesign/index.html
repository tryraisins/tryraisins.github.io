      function mount(i) {
        stage.innerHTML = '';
        requestAnimationFrame(() => {
          stage.appendChild(templates[i].content.cloneNode(true));
          const root = stage.firstElementChild;
          if (root?.matches('[data-radio-root]')) wireRadio(root);
          if (root?.matches('[data-play-root]')) wirePlay(root);
        });
      }

      function setActive(i) {
        if (i < 0 || i >= items.length) return;
        current = i;
        items.forEach((el, j) => {
          el.toggleAttribute('data-active', j === i);
          if (j === i) el.setAttribute('aria-current', 'true');
          else el.removeAttribute('aria-current');
        });
        moveHighlight();
        const url = new URL(location);
        url.searchParams.set('v', i + 1);
        url.hash = '';
        history.replaceState(null, '', url);
        document.documentElement.dataset.variant = String(i + 1);
        status.textContent = `Showing ${variantNames[i]}`;
        mount(i);
        window.scrollTo(0, 0);
      }

      items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
      window.addEventListener('resize', moveHighlight);

      document.addEventListener('keydown', (e) => {
        if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        const num = parseInt(e.key, 10);
        if (num >= 1 && num <= items.length) setActive(num - 1);
        else if (e.key === 'ArrowRight') setActive((current + 1) % items.length);
        else if (e.key === 'ArrowLeft') setActive((current - 1 + items.length) % items.length);
      });

      setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
      requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
    })();</script> </body> </html>
